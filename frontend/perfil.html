<!doctype html>
<html lang="es">
<head>

<title>Mi perfil</title>

<body>
<!-- Ver/editar datos del usuario logueado. Requiere sesion -->
<h2>Mi perfil</h2>

<form id="form-perfil">
    <input type="text" id="nombre" placeholder="Nombre" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Confirmá tu contraseña para guardar" required />

    <button type="submit">Guardar cambios</button>
</form>

<p id="mensaje-perfil"></p>

<script type="module" src="js/pages/perfil.js"></script>
</body>
